services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: trustable-memory-falkordb
    ports:
      - "6379:6379"  # Redis/FalkorDB port
      - "3001:3000"  # FalkorDB browser UI (host 3001 → container 3000)
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

volumes:
  falkordb_data:
